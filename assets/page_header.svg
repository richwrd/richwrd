<svg viewBox="0 0 115 16" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<style>
  svg {
    background-color: transparent;
    width: 110vw;
    position: fixed;
    bottom: -5px;
    overflow: visible;
    transform: rotate(180deg);
  }

  .wave {
    animation: wave 3s linear infinite;
    transition: fill 0.3s ease;
  }

  #wave1 {
    fill: #06b6d4;
    animation-duration: 10s;
    opacity: 0.4;
  }

  #wave2 {
    fill: #0891b2;
    animation-duration: 6s;
    animation-direction: reverse;
    opacity: 0.8;
  }

  #wave2:hover {
    fill: #06b6d4;
    cursor: pointer;
  }

  #wave3 {
    fill: #06b6d4;
    animation-duration: 4s;
    opacity: 0.5;
  }

  @keyframes wave {
    to { transform: translateX(-100%); }
  }
</style>

<defs>
  <path id="wave" d="M 0,10 C 30,10 30,15 60,15 90,15 90,10 120,10 150,10 150,15 180,15 210,15 210,10 240,10 v 28 h -240 z"/>
</defs>

<use id="wave1" class="wave" xlink:href="#wave" x="0" y="-4"/>
<use id="wave3" class="wave" xlink:href="#wave" x="0" y="-2"/>
<use id="wave2" class="wave" xlink:href="#wave" x="0" y="0"/>
</svg>
