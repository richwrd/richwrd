<svg viewBox="0 0 1000 80" xmlns="http://www.w3.org/2000/svg">
<style>
  .node-primary {
    fill: #06b6d4;
  }
  .node-secondary {
    fill: #0891b2;
    opacity: 0.7;
  }
  .node-tertiary {
    fill: #06b6d4;
    opacity: 0.4;
  }
  .line {
    stroke: url(#lineGradient);
    stroke-width: 0.8;
    opacity: 0.5;
  }
  .line-dim {
    stroke: #0891b2;
    stroke-width: 0.5;
    opacity: 0.2;
  }
</style>

<defs>
  <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1"/>
    <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/>
  </linearGradient>
</defs>

<!-- Conexões secundárias (fundo) -->
<g class="connections-dim">
  <line class="line-dim" x1="80" y1="25" x2="180" y2="55">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite"/>
  </line>
  <line class="line-dim" x1="180" y1="55" x2="320" y2="35">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
  </line>
  <line class="line-dim" x1="420" y1="20" x2="520" y2="50">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="2.5s" repeatCount="indefinite"/>
  </line>
  <line class="line-dim" x1="620" y1="60" x2="750" y2="25">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3.5s" repeatCount="indefinite"/>
  </line>
  <line class="line-dim" x1="850" y1="45" x2="950" y2="30">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite"/>
  </line>
  <line class="line-dim" x1="150" y1="40" x2="280" y2="60">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
  </line>
  <line class="line-dim" x1="550" y1="30" x2="680" y2="45">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="2.5s" repeatCount="indefinite"/>
  </line>
</g>

<!-- Conexões principais -->
<g class="connections">
  <line class="line" x1="50" y1="40" x2="150" y2="40">
    <animate attributeName="stroke-width" values="0.8;1.5;0.8" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
  </line>
  <line class="line" x1="150" y1="40" x2="250" y2="35">
    <animate attributeName="stroke-width" values="0.8;1.5;0.8" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </line>
  <line class="line" x1="250" y1="35" x2="380" y2="45">
    <animate attributeName="stroke-width" values="0.8;1.5;0.8" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.5s" repeatCount="indefinite"/>
  </line>
  <line class="line" x1="380" y1="45" x2="480" y2="40">
    <animate attributeName="stroke-width" values="0.8;1.5;0.8" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
  </line>
  <line class="line" x1="480" y1="40" x2="580" y2="38">
    <animate attributeName="stroke-width" values="0.8;1.5;0.8" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </line>
  <line class="line" x1="580" y1="38" x2="700" y2="42">
    <animate attributeName="stroke-width" values="0.8;1.5;0.8" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.5s" repeatCount="indefinite"/>
  </line>
  <line class="line" x1="700" y1="42" x2="820" y2="35">
    <animate attributeName="stroke-width" values="0.8;1.5;0.8" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
  </line>
  <line class="line" x1="820" y1="35" x2="950" y2="40">
    <animate attributeName="stroke-width" values="0.8;1.5;0.8" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </line>
</g>

<!-- Nós terciários (pequenos, fundo) -->
<g class="nodes-tertiary">
  <circle class="node-tertiary" cx="80" cy="25" r="2">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle class="node-tertiary" cx="180" cy="55" r="2">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle class="node-tertiary" cx="320" cy="35" r="1.5">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle class="node-tertiary" cx="420" cy="20" r="2">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle class="node-tertiary" cx="520" cy="50" r="1.5">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle class="node-tertiary" cx="620" cy="60" r="2">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle class="node-tertiary" cx="750" cy="25" r="1.5">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle class="node-tertiary" cx="850" cy="45" r="2">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle class="node-tertiary" cx="280" cy="60" r="1.5">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle class="node-tertiary" cx="680" cy="15" r="1.5">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- Nós secundários (médios) -->
<g class="nodes-secondary">
  <circle class="node-secondary" cx="150" cy="40" r="3">
    <animate attributeName="r" values="3;4;3" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle class="node-secondary" cx="380" cy="45" r="3">
    <animate attributeName="r" values="3;4;3" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle class="node-secondary" cx="580" cy="38" r="3">
    <animate attributeName="r" values="3;4;3" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle class="node-secondary" cx="820" cy="35" r="3">
    <animate attributeName="r" values="3;4;3" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- Nós principais (grandes) -->
<g class="nodes-primary">
  <circle class="node-primary" cx="50" cy="40" r="4">
    <animate attributeName="r" values="4;6;4" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle class="node-primary" cx="250" cy="35" r="5">
    <animate attributeName="r" values="5;7;5" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle class="node-primary" cx="480" cy="40" r="5">
    <animate attributeName="r" values="5;7;5" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle class="node-primary" cx="700" cy="42" r="5">
    <animate attributeName="r" values="5;7;5" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle class="node-primary" cx="950" cy="40" r="4">
    <animate attributeName="r" values="4;6;4" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
</g>
</svg>
